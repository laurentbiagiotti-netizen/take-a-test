name: Démo GitHub Pages

on:
  push:
    branches: [main, securite-pro]
    paths: ["components/**", "lib/**", "site/**", "app/globals.css", "tailwind.config.ts", "public/cybersup-logo-blanc.svg", "package*.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:pages
      - name: Publier sur la branche gh-pages
        run: |
          cd site/dist
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "Démo statique ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
