name: CI

on:
  push:
    branches: [securite-pro, main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: Types, tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://exemple.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
          APP_URL: https://exemple.cybersup.ai
      - name: Build démo statique
        run: npm run build:pages

  sql:
    name: Sécurité de la base (suites SQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y postgresql-client
      - run: bash tests/sql/run.sh

  seed:
    name: QCM d'admission à jour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 supabase/seed/admission-2026/src/gen.py
      - name: Le SQL et les JSON correspondent aux sources
        run: git diff --exit-code supabase/seed
