services:
  app:
    build: .
    image: cybersup-examen:latest
    container_name: cybersup-examen
    restart: unless-stopped
    env_file: .env.local
    ports:
      - "${EXAM_PORT:-31340}:3000"
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Tâche planifiée : clôt les épreuves expirées, envoie les webhooks, purge les photos
  cron:
    image: node:22-bookworm-slim
    container_name: cybersup-examen-cron
    restart: unless-stopped
    env_file: .env.local
    depends_on:
      - app
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    command:
      - node
      - -e
      - "setInterval(()=>fetch('http://app:3000/api/cron/maintenance',{headers:{authorization:'Bearer '+process.env.CRON_SECRET}}).then(r=>{if(!r.ok)console.error('maintenance',r.status)}).catch(e=>console.error('maintenance',e.message)),60000)"
